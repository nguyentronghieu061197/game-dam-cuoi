<!DOCTYPE html>
<html>
<head>
  <script src="assets/three.min.js"></script>
  <script src="assets/meshopt_decoder.js"></script>
  <script src="assets/GLTFLoader.js"></script>
  <style>body { margin: 0; background: #222; }</style>
</head>
<body>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.3, 3);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.5);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(0, 5, 5);
    scene.add(dir);

    const loader = new THREE.GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    loader.load('assets/models/avatars/Asian_M_1_Busi.glb', (gltf) => {
      const model = gltf.scene;
      scene.add(model);

      // Rotate arms down along Y or Z
      const leftArm = model.getObjectByName('LeftArm');
      const rightArm = model.getObjectByName('RightArm');

      if (leftArm) leftArm.rotateZ(1.25);
      if (rightArm) rightArm.rotateZ(-1.25);

      function render() {
        requestAnimationFrame(render);
        renderer.render(scene, camera);
      }
      render();
      window.__ready = true;
    });
  </script>
</body>
</html>
